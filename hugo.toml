baseURL = "https://mwamer.github.io/Frontline-World-LTD/"
locale = "en"
defaultContentLanguage = "en"
title = "Frontline World Ltd"

[params]
  description = "Consultancy helping organisations across business, government, academia, and civil society understand complexity, anticipate change, communicate clearly, and build lasting capability."
  email = "wesaam.amer@gmail.com"
  phone = "+44 (0)7310 498510"

# Social media profiles, rendered site-wide by layouts/partials/social.html.
# Set `url` to the official Frontline World profile when it is available.
# Platforms with an empty url stay visible but are not clickable, and no
# placeholder or invented URLs are used.
[[params.social]]
  name = "LinkedIn"
  label = "Frontline World on LinkedIn"
  url = ""
[[params.social]]
  name = "X (Twitter)"
  label = "Frontline World on X"
  url = ""

[taxonomies]
  # Intentionally empty: disables the default categories and tags taxonomies

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menus]
  # Primary navigation. "Courses" renders a mega menu in layouts/partials/nav.html;
  # its category groups are built from programme content (not hardcoded menu entries).
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 1
  [[menus.main]]
    name = "Our People"
    url = "/our-people/"
    weight = 2
  [[menus.main]]
    name = "Courses"
    url = "/training-academy/"
    weight = 3
    identifier = "courses"
  [[menus.main]]
    name = "Corporate / Organisational Training"
    url = "/training-academy/#for-organisations"
    weight = 4
    identifier = "corporate-training"

  # Secondary "resources" group, rendered beside the primary navigation.
  [[menus.resources]]
    name = "Insights"
    url = "/insights/"
    weight = 1
  [[menus.resources]]
    name = "Sectors"
    url = "/sectors/"
    weight = 2
  [[menus.resources]]
    name = "Contact"
    url = "/contact/"
    weight = 3
