    name = "Home"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menus.main]]
    name = "Our People"
    url = "/our-people/"
    weight = 3
  [[menus.main]]
