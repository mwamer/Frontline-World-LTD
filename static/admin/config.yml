# Decap CMS configuration for the Insights section.
#
# base_url and auth_endpoint point at the OAuth proxy deployed from
# oauth-proxy/. The GitHub OAuth App callback URL must match this hostname plus
# /callback, and the Worker needs GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET
# before login works.
backend:
  name: github
  repo: mwamer/Frontline-World-LTD
  branch: main
  base_url: https://frontline-cms-oauth.wesaam-amer.workers.dev
  auth_endpoint: auth
  # Decap asks for `repo` unless told otherwise, which would grant the token
  # control of every private repository on the account. This repository is
  # public, so the narrower scope the proxy requests is enough. Keep this in
  # step with SCOPES in oauth-proxy/worker.js.
  auth_scope: public_repo

# Every edit becomes a draft pull request, so nothing reaches the live site
# without a review and merge.
publish_mode: editorial_workflow

# Matches the site's existing image convention. The insight layouts strip any
# directory prefix from the stored value, so an editor can pick a file from the
# whole library and the published path stays correct.
media_folder: static/images
public_folder: /images

collections:
  - name: insights
    label: Insights
    label_singular: Insight
    folder: content/insights
    create: true
    # Filenames are the title, so an article's URL is /insights/title/. The
    # date already lives in the date field and drives the ordering, so putting
    # it in the filename as well only lengthened URLs. Matches the existing
    # articles, which all predate this rule.
    slug: "{{slug}}"
    # Decap lists Hugo's _index.md as an entry called "Insight _index", so an
    # editor can publish an article onto the section page instead of into a new
    # file. Only entries with cms_visible: true are listed.
    #
    # The filter compares the raw frontmatter value, and a missing field is
    # undefined, which is not true. So every article needs cms_visible: true
    # written in it. The hidden default below covers entries Decap itself
    # creates, but any file authored outside the CMS must set it by hand.
    # Keep cms_visible: false in content/insights/_index.md.
    filter:
      field: cms_visible
      value: true
    editor:
      # No preview template: the page is rendered by Hugo, not by the CMS.
      preview: false
    fields:
      - label: Title
        name: title
        widget: string

      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false

      - label: Category
        name: category
        widget: select
        options:
          - News
          - Commentary
          - Research
          - Events

      - label: Summary
        name: summary
        widget: text
        hint: One or two sentences. This becomes the page description, the listing card excerpt, and the standfirst on the article, so it appears in all three places.

      - label: Featured image
        name: image
        widget: image
        choose_url: false

      - label: Image alt text
        name: image_alt
        widget: string
        required: false
        hint: Leave blank to use the article title as the alt text.

      - label: Listing order
        name: weight
        widget: number
        value_type: int
        default: 10
        min: 1
        hint: "Lower numbers appear first on the Insights listing, so 1 pins an article to the top. This does not control the home page: the ticker and the Latest Insights cards there are ordered by date, with this number only breaking ties between articles published the same day."

      - label: Home page teaser
        name: teaser
        widget: text
        required: false
        hint: Optional. A short line for the home page ticker and cards, for example "How AI is reshaping trust." Leave blank to reuse the summary.

      - label: Body
        name: body
        widget: markdown
        required: false

      # Decap has no built-in way to exclude a single file, so the collection
      # filter above keeps the section page out of the entry list. Never show
      # this to editors; every new article gets it automatically.
      - label: Show in CMS
        name: cms_visible
        widget: hidden
        default: true
