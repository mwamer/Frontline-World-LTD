# Decap CMS configuration for the Insights section.
#
# base_url and auth_endpoint point at the OAuth proxy deployed from
# oauth-proxy/. The GitHub OAuth App callback URL must match this hostname plus
# /callback, and the Worker needs GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET
# before login works.
backend:
  name: github
  repo: mwamer/Frontline-World-LTD
  branch: main
  base_url: https://frontline-cms-oauth.wesaam-amer.workers.dev
  auth_endpoint: auth
  # Decap asks for `repo` unless told otherwise, which would grant the token
  # control of every private repository on the account. This repository is
  # public, so the narrower scope the proxy requests is enough. Keep this in
  # step with SCOPES in oauth-proxy/worker.js.
  auth_scope: public_repo

# Every edit becomes a draft pull request, so nothing reaches the live site
# without a review and merge.
publish_mode: editorial_workflow

# Matches the site's existing image convention. The insight layouts strip any
# directory prefix from the stored value, so an editor can pick a file from the
# whole library and the published path stays correct.
media_folder: static/images
public_folder: /images

collections:
  - name: insights
    label: Insights
    label_singular: Insight
    folder: content/insights
    create: true
    # Filenames are the title, so an article's URL is /insights/title/. The
    # date already lives in the date field and drives the ordering, so putting
    # it in the filename as well only lengthened URLs. Matches the existing
    # articles, which all predate this rule.
    slug: "{{slug}}"
    # Decap lists Hugo's _index.md as an entry called "Insight _index", so an
    # editor can publish an article onto the section page instead of into a new
    # file. Only entries with cms_visible: true are listed.
    #
    # The filter compares the raw frontmatter value, and a missing field is
    # undefined, which is not true. So every article needs cms_visible: true
    # written in it. The hidden default below covers entries Decap itself
    # creates, but any file authored outside the CMS must set it by hand.
    # Keep cms_visible: false in content/insights/_index.md.
    filter:
      field: cms_visible
      value: true
    editor:
      # No preview template: the page is rendered by Hugo, not by the CMS.
      preview: false
    fields:
      - label: Title
        name: title
        widget: string

      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false

      - label: Category
        name: category
        widget: select
        options:
          - News
          - Commentary
          - Research
          - Events

      - label: Summary
        name: summary
        widget: text
        hint: One or two sentences. This becomes the page description, the listing card excerpt, and the standfirst on the article, so it appears in all three places.

      - label: Featured image
        name: image
        widget: image
        choose_url: false

      - label: Image alt text
        name: image_alt
        widget: string
        required: false
        hint: Leave blank to use the article title as the alt text.

      - label: Listing order
        name: weight
        widget: number
        value_type: int
        default: 10
        min: 1
        hint: "Lower numbers appear first on the Insights listing, so 1 pins an article to the top. This does not control the home page: the ticker and the Latest Insights cards there are ordered by date, with this number only breaking ties between articles published the same day."

      - label: Home page teaser
        name: teaser
        widget: text
        required: false
        hint: Optional. A short line for the home page ticker and cards, for example "How AI is reshaping trust." Leave blank to reuse the summary.

      - label: Body
        name: body
        widget: markdown
        required: false

      # Decap has no built-in way to exclude a single file, so the collection
      # filter above keeps the section page out of the entry list. Never show
      # this to editors; every new article gets it automatically.
      - label: Show in CMS
        name: cms_visible
        widget: hidden
        default: true

  # The people working on one course, programme, research project or
  # consultancy. One file per activity in data/assignments/, named after the
  # activity's URL slug. An entry names an associate and the part they play on
  # that activity; everything about the person comes from their record in
  # Associates, so a person is never written twice.
  - name: assignments
    label: Assignments
    label_singular: Assignment
    description: >-
      The people on one course, programme, research project or consultancy. A
      file holds the team for one activity, named after that activity's URL
      slug.
    folder: data/assignments
    create: true
    extension: yml
    format: yaml
    editor:
      preview: false
    fields:
      - label: Activity type
        name: type
        widget: select
        default: course
        options:
          - course
          - programme
          - research
          - consultancy
          - project
        hint: What kind of activity this is. Used to group the list.

      - label: Activity name
        name: title
        widget: string
        hint: Display name of the activity. Keep it in step with the activity's page title.

      - label: Activity identifier
        name: slug
        widget: string
        hint: >-
          Identifies which activity this file belongs to. Must match the
          activity page's URL slug — for example
          ai-in-teaching-practices-and-design — because the page finds its file
          by that name. The file name and this value should stay in step.

      - label: Team
        name: team
        widget: list
        collapsed: false
        summary: "{{fields.associate}} — {{fields.assignment_role}}"
        hint: >-
          One entry per person on this activity. The person's details are not
          written here: point at their record in Associates, and the page reads
          the name, title, organisation, photograph and biography from it.
        fields:
          - label: Associate
            name: associate
            widget: string
            hint: >-
              The associate ID, which is their file name in the Associates
              collection — for example saeed-abuzour. It must match exactly.
              Leave it blank until the details are confirmed.

          - label: Role on this activity
            name: assignment_role
            widget: string
            required: false
            hint: >-
              Optional. What they do on this activity, for example Course
              Director. This is the assignment role, and it is deliberately
              separate from the general roles on their own record, which say
              what the person can generally contribute.

          - label: Title on this activity
            name: title
            widget: string
            required: false
            hint: >-
              Optional. Replaces their own title on this activity only. Leave
              blank to use the title in their associate record.

          - label: Focus on this activity
            name: focus
            widget: string
            required: false
            hint: >-
              Optional. A short line on what they are there to do, shown on the
              card under their name.

          - label: Display order
            name: order
            widget: number
            value_type: int
            required: false
            hint: Lower numbers appear first. Leave blank to keep the order they are written in.

          - label: Published on this activity
            name: visible
            widget: boolean
            default: true
            required: false
            hint: >-
              Untick to hold an entry back without deleting it. A file with an
              empty team shows the page's own placeholder.

  # The people behind Expertise On Demand. One file per person in
  # data/associates/; the file name is the associate ID, which becomes the
  # profile URL (/people/<id>/) and the reference a course uses. Editing a
  # record here updates the Our People page, the directory card, the filters and
  # the profile page at once, so a person is never written twice.
  - name: associates
    label: Associates
    label_singular: Associate
    description: >-
      People in the directory on the Our People page. One file per person. The
      file name is the associate ID: it becomes the profile URL and the
      reference a course uses, so do not rename a file.
    folder: data/associates
    create: true
    extension: yml
    format: yaml
    # The ID is the file name, and a new person gets one from their name.
    slug: "{{slug}}"
    editor:
      # No preview template: the page is rendered by Hugo, not by the CMS.
      preview: false
    view_filters:
      - label: Leadership
        field: leadership
        pattern: true
      - label: Published
        field: visibility
        pattern: public
      - label: Private
        field: visibility
        pattern: private
    fields:
      - label: Full name
        name: name
        widget: string

      - label: Professional title
        name: title
        widget: string

      - label: Organisation
        name: organisation
        widget: string
        required: false

      - label: Professional photo
        name: photo
        widget: image
        choose_url: false
        hint: >-
          A headshot, square or 4:5. It is cropped to a square on the Our
          People page and to 4:5 on the profile page.

      - label: Photo alt text
        name: photo_alt
        widget: string
        required: false
        hint: Leave blank to use the person's name as the alt text.

      - label: Summary
        name: summary
        widget: text
        required: false
        hint: >-
          One or two sentences. This is the directory card text and the page
          description on the profile, so it appears in both places.

      - label: Biography
        name: bio
        widget: list
        required: false
        summary: "{{{fields.paragraph}}}"
        fields:
          - label: Paragraph
            name: paragraph
            widget: text

      # The five lists below store the ID of each term, never its wording. The
      # options mirror data/vocab/associates.yml, which is where the wording
      # lives: when a term is added or relabelled there, add or relabel it here
      # too. A term nobody holds never reaches the published page.
      - label: Expertise
        name: expertise
        widget: select
        multiple: true
        required: false
        hint: What this person knows. The first entry is the card's headline expertise.
        options:
        - { label: "Strategic Foresight", value: "strategic-foresight" }
        - { label: "Strategic Research", value: "strategic-research" }
        - { label: "Strategic Communication", value: "strategic-communication" }
        - { label: "Political Communication", value: "political-communication" }
        - { label: "Digital Media", value: "digital-media" }
        - { label: "AI & Emerging Technologies", value: "ai-emerging-tech" }
        - { label: "Media & Journalism", value: "media-journalism" }
        - { label: "Conflict & Security", value: "conflict-security" }
        - { label: "Peace & Resilience", value: "peace-resilience" }
        - { label: "Education & Training", value: "education-training" }
        - { label: "Leadership", value: "leadership" }
        - { label: "Organisational Resilience", value: "organisational-resilience" }
        - { label: "Institutional Development", value: "institutional-development" }
        - { label: "Research Methods", value: "research-methods" }
        - { label: "Policy & Governance", value: "policy-governance" }
        - { label: "Technology & Society", value: "technology-society" }
        - { label: "Other expertise", value: "other" }

      - label: Roles
        name: roles
        widget: select
        multiple: true
        required: false
        hint: What they contribute generally, across assignments.
        options:
        - { label: "Founder & Director", value: "founder-director" }
        - { label: "Programme Director", value: "programme-director" }
        - { label: "Programme Lead", value: "programme-lead" }
        - { label: "Course Director", value: "course-director" }
        - { label: "Trainer / Facilitator", value: "trainer-facilitator" }
        - { label: "Subject-Matter Expert", value: "subject-matter-expert" }
        - { label: "Researcher", value: "researcher" }
        - { label: "Consultant", value: "consultant" }
        - { label: "Advisor", value: "advisor" }
        - { label: "Speaker", value: "speaker" }
        - { label: "Mentor", value: "mentor" }

      - label: Areas of contribution
        name: contributions
        widget: select
        multiple: true
        required: false
        hint: The kinds of work they are engaged for.
        options:
        - { label: "Courses", value: "courses" }
        - { label: "Executive Education", value: "executive-education" }
        - { label: "Professional Training", value: "professional-training" }
        - { label: "Research", value: "research" }
        - { label: "Consultancy", value: "consultancy" }
        - { label: "Strategic Advisory", value: "strategic-advisory" }
        - { label: "Policy Work", value: "policy-work" }
        - { label: "Events & Conferences", value: "events-conferences" }
        - { label: "Speaking Engagements", value: "speaking-engagements" }
        - { label: "Programme Development", value: "programme-development" }

      - label: Sectors
        name: sectors
        widget: select
        multiple: true
        required: false
        hint: The sectors on the Sectors page they have worked in.
        options:
        - { label: "Education", value: "education" }
        - { label: "Media & Communication", value: "media-communication" }
        - { label: "Government & Governance", value: "government-governance" }
        - { label: "Technology & Digital Transformation", value: "technology-digital-transformation" }
        - { label: "Health & Wellbeing", value: "health-wellbeing" }
        - { label: "Sustainability & Development", value: "sustainability-development" }
        - { label: "Cultural Resilience", value: "cultural-resilience" }
        - { label: "Conflict & Post-Conflict Recovery", value: "conflict-post-conflict-recovery" }

      - label: Regions
        name: regions
        widget: select
        multiple: true
        required: false
        hint: Where they have worked.
        options:
        - { label: "Palestine", value: "palestine" }
        - { label: "United Kingdom", value: "united-kingdom" }
        - { label: "Germany", value: "germany" }
        - { label: "United States", value: "united-states" }

      - label: Countries and regions
        name: countries
        widget: list
        required: false
        summary: "{{{fields.country}}}"
        hint: >-
          Optional. Countries or regions of specific expertise, for places the
          Regions list above does not cover. One per entry.
        fields:
          - label: Country or region
            name: country
            widget: string

      - label: Qualifications
        name: qualifications
        widget: list
        required: false
        summary: "{{{fields.qualification}}}"
        hint: Optional. One qualification per entry. Shown on the profile page.
        fields:
          - label: Qualification
            name: qualification
            widget: string

      - label: Selected experience
        name: experience
        widget: list
        required: false
        summary: "{{{fields.entry}}}"
        hint: >-
          Optional. One line per role, project or achievement. Shown on the
          profile page.
        fields:
          - label: Entry
            name: entry
            widget: string

      - label: Subjects taught
        name: teaching_subjects
        widget: list
        required: false
        summary: "{{{fields.subject}}}"
        hint: Optional. Subjects or topics the person can teach or deliver.
        fields:
          - label: Subject
            name: subject
            widget: string

      - label: Languages
        name: languages
        widget: list
        required: false
        summary: "{{{fields.language}}}"
        hint: >-
          Optional. One per entry, with the proficiency — for example
          "English — fluent".
        fields:
          - label: Language and proficiency
            name: language
            widget: string

      - label: Professional links
        name: links
        widget: list
        required: false
        summary: "{{{fields.label}}}"
        fields:
          - label: Label
            name: label
            widget: string

          - label: URL
            name: url
            widget: string

      - label: Public visibility
        name: visibility
        widget: select
        default: private
        options:
          - private
          - public
        hint: >-
          Public puts the person on the site: a directory card, a filter
          option, a profile page, and a trainer entry on any course that names
          them. Private keeps them off entirely. This is the applicant's
          consent, not a preference: if they answered No to the public-profile
          question on the application, leave it private.

      - label: Profile status
        name: profile_status
        widget: select
        default: active
        options:
          - active
          - inactive
          - archived
        hint: >-
          Active publishes the person; inactive and archived keep them off the
          site without discarding the record, so an application can be held, or
          an association paused, without deleting anything.

      - label: Leadership
        name: leadership
        widget: boolean
        default: false
        required: false
        hint: >-
          Tick for the person who leads Frontline World. They appear in the
          leadership block on the Our People page instead of the directory
          grid, so their details are not repeated twice.

      - label: Listing order
        name: weight
        widget: number
        value_type: int
        default: 10
        min: 1
        hint: Lower numbers come first in the directory.

  # The wording behind the terms the associate records refer to by ID. This is
  # the only place a term is labelled, and the five lists inside it drive the
  # directory filters, the profile tags and the field options above. The file
  # exists as it is; only the labels are edited here.
  - name: vocabulary
    label: Vocabulary
    label_singular: Vocabulary file
    description: >-
      The wording of every expertise, role, contribution, sector and region an
      associate can be tagged with. One file, listed here so the terms can be
      relabelled without editing YAML by hand.
    folder: data/vocab
    create: false
    extension: yml
    format: yaml
    editor:
      preview: false
    fields:
      - label: Expertise terms
        name: expertise
        widget: list
        summary: "{{{fields.label}}}"
        fields:
          - label: Label
            name: label
            widget: string

          - label: ID
            name: id
            widget: string
            hint: "Never change this on a published term: records refer to it."

      - label: Role terms
        name: roles
        widget: list
        summary: "{{{fields.label}}}"
        fields:
          - label: Label
            name: label
            widget: string

          - label: ID
            name: id
            widget: string
            hint: "Never change this on a published term: records refer to it."

      - label: Contribution terms
        name: contributions
        widget: list
        summary: "{{{fields.label}}}"
        fields:
          - label: Label
            name: label
            widget: string

          - label: ID
            name: id
            widget: string
            hint: "Never change this on a published term: records refer to it."

      - label: Sector terms
        name: sectors
        widget: list
        summary: "{{{fields.label}}}"
        fields:
          - label: Label
            name: label
            widget: string

          - label: ID
            name: id
            widget: string
            hint: "Never change this on a published term: records refer to it."

      - label: Region terms
        name: regions
        widget: list
        summary: "{{{fields.label}}}"
        fields:
          - label: Label
            name: label
            widget: string

          - label: ID
            name: id
            widget: string
            hint: "Never change this on a published term: records refer to it."

  # Incoming applications to become an associate, and the private record for
  # each person. One file per person in data/private/applications/, named
  # after their associate ID, so the same ID joins a submitted application to
  # the published record in data/associates/.
  #
  # Nothing in this folder is published. No template reads it, and the folder
  # is not served, so contact details, files, consent and the review history
  # stay out of the built site entirely. Approving an application means copying
  # the public fields into the Associates collection and setting visibility
  # there; the two files then hold the public profile and the private
  # material, and never the same field twice.
  - name: applications
    label: Applications
    label_singular: Application
    description: >-
      Applications to become an associate, and the private record for each
      person. Not published. Approving means creating or updating the person's
      record in Associates with the public fields, and setting visibility there
      to match their consent.
    folder: data/private/applications
    create: true
    extension: yml
    format: yaml
    slug: "{{slug}}"
    # Uploads for this collection go to a folder outside static/, so a
    # photograph or a CV is never served by the built site. This overrides the
    # site-wide media_folder, which points at static/images.
    media_folder: data/private/uploads
    public_folder: /images
    editor:
      preview: false
    view_filters:
      - label: New
        field: status
        pattern: submitted
      - label: Under review
        field: status
        pattern: under-review
      - label: Changes requested
        field: status
        pattern: changes-requested
      - label: Approved
        field: status
        pattern: approved
    fields:
      # ---- Review and workflow. Everything from here to the end of this
      # ---- collection is administrative and is never published.
      - label: Application status
        name: status
        widget: select
        default: submitted
        options:
          - { label: "Draft", value: "draft" }
          - { label: "Submitted", value: "submitted" }
          - { label: "Under review", value: "under-review" }
          - { label: "Changes requested", value: "changes-requested" }
          - { label: "Approved", value: "approved" }
          - { label: "Rejected", value: "rejected" }
          - { label: "Archived", value: "archived" }
        hint: >-
          Where this application is in the review. Nothing here affects the
          public site: an application is never published, whatever its status.
          Publication is decided separately, on the person's record in
          Associates, with its visibility field.

      - label: Date submitted
        name: date_submitted
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
        required: false

      - label: Date decided
        name: date_decided
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
        required: false
        hint: The day of the most recent decision, whatever it was.

      - label: Date approved
        name: date_approved
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
        required: false
        hint: >-
          The day this person was accepted. This is the date to quote when they
          were first approved, so it stays put if changes are requested later.

      - label: Review notes
        name: review
        widget: list
        required: false
        collapsed: true
        summary: "{{{fields.date}}} — {{{fields.outcome}}}"
        hint: >-
          One entry per review action, so the history is kept. Write what you
          checked and what you decided, and add an entry rather than replacing
          the last one.
        fields:
          - label: Date
            name: date
            widget: string
            hint: For example 2026-03-14.

          - label: Action
            name: outcome
            widget: select
            options:
              - { label: "Save draft", value: "save-draft" }
              - { label: "Request changes", value: "request-changes" }
              - { label: "Approve", value: "approve" }
              - { label: "Reject", value: "reject" }
              - { label: "Archive", value: "archive" }

          - label: Note
            name: note
            widget: text
            required: false
            hint: >-
              What was requested, or why the application was approved or
              declined. This is internal: the applicant is not shown it.

      - label: Internal notes
        name: admin_notes
        widget: text
        required: false
        hint: >-
          Anything the review notes do not cover. Internal only, and kept
          separate from what the applicant wrote, so the two are never confused.

      - label: Public profile consent
        name: public_consent
        widget: select
        default: pending
        options:
          - { label: "Yes — may publish the profile", value: "yes" }
          - { label: "No — keep the profile private", value: "no" }
          - { label: "Not yet answered", value: "pending" }
        hint: >-
          What the applicant answered. This is their decision, not yours: if it
          is No, the record in Associates must stay private however strong the
          application is.

      - label: Consent confirmed
        name: consent_confirmed
        widget: boolean
        default: false
        required: false
        hint: Tick once the three statements in the consent section are ticked and accurate.

      # ---- Section 1: basic information.
      - label: Full name
        name: name
        widget: string
        hint: >-
          The person's full name. The file name becomes the associate ID from
          this, so it is the same ID the record in Associates will use.

      - label: Professional title
        name: title
        widget: string

      - label: Organisation
        name: organisation
        widget: string
        required: false

      - label: Current position or role
        name: current_role
        widget: string
        required: false

      - label: Professional email
        name: email
        widget: string
        hint: Private. Never copied into the published record.

      - label: Country or base
        name: country
        widget: string
        required: false

      - label: Website
        name: website
        widget: string
        required: false

      - label: LinkedIn
        name: linkedin
        widget: string
        required: false

      - label: Photograph
        name: photo
        widget: image
        choose_url: false
        required: false
        hint: >-
          Uploads to data/private/uploads/, which the site does not serve. To
          publish it, copy the file into static/images/ and set the public
          record's photo field to its file name.

      # ---- Section 2: professional profile.
      - label: Short biography
        name: bio_short
        widget: text
        required: false
        hint: The one or two sentences the applicant gave for the directory card.

      - label: Extended biography
        name: bio_long
        widget: text
        required: false
        hint: >-
          Splits into paragraphs on the public profile, one per blank line.
          Copy it into the record's biography, one paragraph per entry.

      - label: Qualifications
        name: qualifications
        widget: list
        required: false
        summary: "{{{fields.qualification}}}"
        hint: The applicant sends one per line, so add one list entry per line.
        fields:
          - label: Qualification
            name: qualification
            widget: string

      - label: Selected experience
        name: experience
        widget: list
        required: false
        summary: "{{{fields.entry}}}"
        hint: The applicant sends one per line, so add one list entry per line.
        fields:
          - label: Entry
            name: entry
            widget: string

      # ---- Section 3: expertise. The IDs match the published record, so an
      # approved application needs no translation.
      - label: Expertise
        name: expertise
        widget: select
        multiple: true
        required: false
        hint: What the applicant said they know. The first entry becomes the card's headline expertise.
        options:
        - { label: "Strategic Foresight", value: "strategic-foresight" }
        - { label: "Strategic Research", value: "strategic-research" }
