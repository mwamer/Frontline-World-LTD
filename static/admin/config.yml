# Decap CMS configuration for the Insights section.
#
# base_url and auth_endpoint point at the OAuth proxy deployed from
# oauth-proxy/. The GitHub OAuth App callback URL must match this hostname plus
# /callback, and the Worker needs GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET
# before login works.
backend:
  name: github
  repo: mwamer/Frontline-World-LTD
  branch: main
  base_url: https://frontline-cms-oauth.wesaam-amer.workers.dev
  auth_endpoint: auth
  # Decap asks for `repo` unless told otherwise, which would grant the token
  # control of every private repository on the account. This repository is
  # public, so the narrower scope the proxy requests is enough. Keep this in
  # step with SCOPES in oauth-proxy/worker.js.
  auth_scope: public_repo

# Every edit becomes a draft pull request, so nothing reaches the live site
# without a review and merge.
publish_mode: editorial_workflow

# Matches the site's existing image convention. The insight layouts strip any
# directory prefix from the stored value, so an editor can pick a file from the
# whole library and the published path stays correct.
media_folder: static/images
public_folder: /images

collections:
  - name: insights
    label: Insights
    label_singular: Insight
    folder: content/insights
    create: true
    # Filenames are the title, so an article's URL is /insights/title/. The
    # date already lives in the date field and drives the ordering, so putting
    # it in the filename as well only lengthened URLs. Matches the existing
    # articles, which all predate this rule.
    slug: "{{slug}}"
    # Decap lists Hugo's _index.md as an entry called "Insight _index", so an
    # editor can publish an article onto the section page instead of into a new
    # file. Only entries with cms_visible: true are listed.
    #
    # The filter compares the raw frontmatter value, and a missing field is
    # undefined, which is not true. So every article needs cms_visible: true
    # written in it. The hidden default below covers entries Decap itself
    # creates, but any file authored outside the CMS must set it by hand.
    # Keep cms_visible: false in content/insights/_index.md.
    filter:
      field: cms_visible
      value: true
    editor:
      # No preview template: the page is rendered by Hugo, not by the CMS.
      preview: false
    fields:
      - label: Title
        name: title
        widget: string

      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false

      - label: Category
        name: category
        widget: select
        options:
          - News
          - Commentary
          - Research
          - Events

      - label: Summary
        name: summary
        widget: text
        hint: One or two sentences. This becomes the page description, the listing card excerpt, and the standfirst on the article, so it appears in all three places.

      - label: Featured image
        name: image
        widget: image
        choose_url: false

      - label: Image alt text
        name: image_alt
        widget: string
        required: false
        hint: Leave blank to use the article title as the alt text.

      - label: Listing order
        name: weight
        widget: number
        value_type: int
        default: 10
        min: 1
        hint: "Lower numbers appear first on the Insights listing, so 1 pins an article to the top. This does not control the home page: the ticker and the Latest Insights cards there are ordered by date, with this number only breaking ties between articles published the same day."

      - label: Home page teaser
        name: teaser
        widget: text
        required: false
        hint: Optional. A short line for the home page ticker and cards, for example "How AI is reshaping trust." Leave blank to reuse the summary.

      - label: Body
        name: body
        widget: markdown
        required: false

      # Decap has no built-in way to exclude a single file, so the collection
      # filter above keeps the section page out of the entry list. Never show
      # this to editors; every new article gets it automatically.
      - label: Show in CMS
        name: cms_visible
        widget: hidden
        default: true

  # Course trainer profiles. Each file in data/trainers/ holds the trainers
  # for one course, keyed by the course page's URL slug. The files are plain
  # YAML frontmatter, so the admin edits only trainer data and never the
  # course page HTML. The page itself calls the course-trainers shortcode,
  # which reads the matching file by slug.
  - name: courses
    label: Courses
    label_singular: Course
    description: Trainer profiles for each course. A file holds the trainers for one course, keyed by the course slug.
    folder: data/trainers
    create: true
    extension: yml
    format: yaml
    editor:
      preview: false
    fields:
      - label: Course name
        name: title
        widget: string
        hint: Display name of the course, shown in the Courses list and in the editor. Keep it in step with the course page title.

      - label: Course identifier
        name: slug
        widget: string
        hint: Identifies which course this file belongs to. Must match the course page's URL slug — for example ai-in-teaching-practices-and-design — so the page finds the right file. The file name and this value should stay in step.

      - label: Trainers
        name: trainers
        widget: list
        collapsed: false
        summary: "{{fields.associate}} — {{fields.role}}"
        hint: >-
          One entry per trainer on this course. The person's details are not
          written here: point at their record in Associates, and the page reads
          the name, title, organisation, photo and biography from it.
        fields:
          - label: Associate
            name: associate
            widget: string
            hint: >-
              The associate ID, which is their file name in the Associates
              collection — for example saeed-abuzour. It must match exactly.
              Leave a field blank until the details are confirmed.

          - label: Role on this course
            name: role
            widget: string
            required: false
            hint: >-
              Optional. The part they play on this course, for example Lead
              trainer. This is course-specific and stays in this file, unlike
              their general roles, which live in their own record.

          - label: Title on this course
            name: title
            widget: string
            required: false
            hint: >-
              Optional. Replaces their own title on this course only. Leave
              blank to use the title in their associate record.

  # The people behind Expertise On Demand. One file per person in
  # data/associates/; the file name is the associate ID, which becomes the
  # profile URL (/people/<id>/) and the reference a course uses. Editing a
  # record here updates the Our People page, the directory card, the filters and
  # the profile page at once, so a person is never written twice.
  - name: associates
    label: Associates
    label_singular: Associate
    description: >-
      People in the directory on the Our People page. One file per person. The
      file name is the associate ID: it becomes the profile URL and the
      reference a course uses, so do not rename a file.
    folder: data/associates
    create: true
    extension: yml
    format: yaml
    # The ID is the file name, and a new person gets one from their name.
    slug: "{{slug}}"
    editor:
      # No preview template: the page is rendered by Hugo, not by the CMS.
      preview: false
    view_filters:
      - label: Leadership
        field: leadership
        pattern: true
    fields:
      - label: Full name
        name: name
        widget: string

      - label: Professional title
        name: title
        widget: string

      - label: Organisation
        name: organisation
        widget: string
        required: false

      - label: Professional photo
        name: photo
        widget: image
        choose_url: false
        hint: >-
          A headshot, square or 4:5. It is cropped to a square on the Our
          People page and to 4:5 on the profile page.

      - label: Photo alt text
        name: photo_alt
        widget: string
        required: false
        hint: Leave blank to use the person's name as the alt text.

      - label: Summary
        name: summary
        widget: text
        required: false
        hint: >-
          One or two sentences. This is the directory card text and the page
          description on the profile, so it appears in both places.

      - label: Biography
        name: bio
        widget: list
        required: false
        summary: "{{{fields.paragraph}}}"
        fields:
          - label: Paragraph
            name: paragraph
            widget: text

      # The five lists below store the ID of each term, never its wording. The
      # options mirror data/vocab/associates.yml, which is where the wording
      # lives: when a term is added or relabelled there, add or relabel it here
      # too. A term nobody holds never reaches the published page.
      - label: Expertise
        name: expertise
        widget: select
        multiple: true
        required: false
        hint: What this person knows. The first entry is the card's headline expertise.
        options:
        - { label: "Strategic Foresight", value: "strategic-foresight" }
        - { label: "Strategic Research", value: "strategic-research" }
        - { label: "Strategic Communication", value: "strategic-communication" }
        - { label: "Political Communication", value: "political-communication" }
        - { label: "Digital Media", value: "digital-media" }
        - { label: "AI & Emerging Technologies", value: "ai-emerging-tech" }
        - { label: "Media & Journalism", value: "media-journalism" }
        - { label: "Conflict & Security", value: "conflict-security" }
        - { label: "Peace & Resilience", value: "peace-resilience" }
        - { label: "Education & Training", value: "education-training" }
        - { label: "Leadership", value: "leadership" }
        - { label: "Organisational Resilience", value: "organisational-resilience" }
        - { label: "Institutional Development", value: "institutional-development" }
        - { label: "Research Methods", value: "research-methods" }
        - { label: "Policy & Governance", value: "policy-governance" }
        - { label: "Technology & Society", value: "technology-society" }
        - { label: "Other expertise", value: "other" }

      - label: Roles
        name: roles
        widget: select
        multiple: true
        required: false
        hint: What they contribute generally, across assignments.
        options:
        - { label: "Founder & Director", value: "founder-director" }
        - { label: "Programme Director", value: "programme-director" }
        - { label: "Programme Lead", value: "programme-lead" }
        - { label: "Course Director", value: "course-director" }
        - { label: "Trainer / Facilitator", value: "trainer-facilitator" }
        - { label: "Subject-Matter Expert", value: "subject-matter-expert" }
        - { label: "Researcher", value: "researcher" }
        - { label: "Consultant", value: "consultant" }
        - { label: "Advisor", value: "advisor" }
        - { label: "Speaker", value: "speaker" }
        - { label: "Mentor", value: "mentor" }

      - label: Areas of contribution
        name: contributions
        widget: select
        multiple: true
        required: false
        hint: The kinds of work they are engaged for.
        options:
        - { label: "Professional Training", value: "professional-training" }
        - { label: "Executive Education", value: "executive-education" }
        - { label: "Research", value: "research" }
        - { label: "Consultancy", value: "consultancy" }
        - { label: "Strategic Advisory", value: "strategic-advisory" }

      - label: Sectors
        name: sectors
        widget: select
        multiple: true
        required: false
        hint: The sectors on the Sectors page they have worked in.
        options:
        - { label: "Education", value: "education" }
        - { label: "Media & Communication", value: "media-communication" }
        - { label: "Government & Governance", value: "government-governance" }
        - { label: "Technology & Digital Transformation", value: "technology-digital-transformation" }
        - { label: "Health & Wellbeing", value: "health-wellbeing" }
        - { label: "Sustainability & Development", value: "sustainability-development" }
        - { label: "Cultural Resilience", value: "cultural-resilience" }
        - { label: "Conflict & Post-Conflict Recovery", value: "conflict-post-conflict-recovery" }

      - label: Regions
        name: regions
        widget: select
        multiple: true
        required: false
        hint: Where they have worked.
        options:
        - { label: "Palestine", value: "palestine" }
        - { label: "United Kingdom", value: "united-kingdom" }
        - { label: "Germany", value: "germany" }
        - { label: "United States", value: "united-states" }

      - label: Professional links
        name: links
        widget: list
        required: false
        summary: "{{{fields.label}}}"
        fields:
          - label: Label
            name: label
            widget: string

          - label: URL
            name: url
            widget: string

      - label: Status
        name: status
        widget: select
        default: private
        options:
          - private
          - public
        hint: >-
          A private record is kept off the site entirely: no directory card, no
          filter, no profile page. Set it to public when the person is
          announced.

      - label: Leadership
        name: leadership
        widget: boolean
        default: false
        required: false
        hint: >-
          Tick for the person who leads Frontline World. They appear in the
          leadership block on the Our People page instead of the directory
          grid, so their details are not repeated twice.

      - label: Listing order
        name: weight
        widget: number
        value_type: int
        default: 10
        min: 1
        hint: Lower numbers come first in the directory.

  # The wording behind the terms the associate records refer to by ID. This is
  # the only place a term is labelled, and the five lists inside it drive the
  # directory filters, the profile tags and the field options above. The file
  # exists as it is; only the labels are edited here.
  - name: vocabulary
    label: Vocabulary
    label_singular: Vocabulary file
    description: >-
      The wording of every expertise, role, contribution, sector and region an
      associate can be tagged with. One file, listed here so the terms can be
      relabelled without editing YAML by hand.
    folder: data/vocab
    create: false
    extension: yml
    format: yaml
    editor:
      preview: false
    fields:
      - label: Expertise terms
        name: expertise
        widget: list
        summary: "{{{fields.label}}}"
        fields:
          - label: Label
            name: label
            widget: string

          - label: ID
            name: id
            widget: string
            hint: "Never change this on a published term: records refer to it."

      - label: Role terms
        name: roles
        widget: list
        summary: "{{{fields.label}}}"
        fields:
          - label: Label
            name: label
            widget: string

          - label: ID
            name: id
            widget: string
            hint: "Never change this on a published term: records refer to it."

      - label: Contribution terms
        name: contributions
        widget: list
        summary: "{{{fields.label}}}"
        fields:
          - label: Label
            name: label
            widget: string

          - label: ID
            name: id
            widget: string
            hint: "Never change this on a published term: records refer to it."

      - label: Sector terms
        name: sectors
        widget: list
        summary: "{{{fields.label}}}"
        fields:
          - label: Label
            name: label
            widget: string

          - label: ID
            name: id
            widget: string
            hint: "Never change this on a published term: records refer to it."

      - label: Region terms
        name: regions
        widget: list
        summary: "{{{fields.label}}}"
        fields:
          - label: Label
            name: label
            widget: string

          - label: ID
            name: id
            widget: string
            hint: "Never change this on a published term: records refer to it."
