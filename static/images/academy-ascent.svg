<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Abstract diagram of four ascending steps with a path rising across them">
  <rect width="600" height="800" fill="#0F2A26"/>

  <!-- faint strata, so the steps read as levels rather than decoration -->
  <g stroke="#E9E1D2" stroke-width="1" opacity="0.13">
    <path d="M70 250H530"/>
    <path d="M70 400H530"/>
    <path d="M70 550H530"/>
  </g>

  <!-- the ascent: tread, riser, tread, riser, tread, riser, tread -->
  <g fill="none" stroke="#F8F6F1" stroke-width="1.4" stroke-linecap="round" opacity="0.82">
    <path d="M90 600H195V510H300V420H405V330H510"/>
  </g>

  <!-- the second, lighter course running parallel to the first -->
  <g fill="none" stroke="#E9E1D2" stroke-width="1.1" stroke-linecap="round" opacity="0.34">
    <path d="M90 624H195V534H300V444H405V354H510"/>
  </g>

  <!-- path climbing from the first tread to the summit -->
  <g fill="none" stroke="#F8F6F1" stroke-width="1.4" stroke-linecap="round" opacity="0.62">
    <path d="M90 600C150 556 232 500 300 420C368 340 452 268 510 186"/>
  </g>

  <!-- branches, echoing the branching-futures rail art -->
  <g fill="none" stroke="#F8F6F1" stroke-width="1.1" stroke-linecap="round" opacity="0.4">
    <path d="M195 510C172 470 148 438 120 404"/>
    <path d="M300 420C326 382 356 352 392 328"/>
    <path d="M405 330C430 300 456 274 484 254"/>
  </g>

  <!-- the accent step, and the accent nodes -->
  <path d="M300 420H405" fill="none" stroke="#C96F58" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>

  <g fill="#F8F6F1" opacity="0.9">
    <circle cx="90" cy="600" r="7"/>
    <circle cx="195" cy="510" r="7"/>
    <circle cx="405" cy="330" r="7"/>
  </g>
  <g fill="#C96F58">
    <circle cx="300" cy="420" r="7"/>
    <circle cx="510" cy="186" r="9"/>
  </g>
  <g fill="#E9E1D2" opacity="0.5">
    <circle cx="120" cy="404" r="5"/>
    <circle cx="392" cy="328" r="5"/>
    <circle cx="484" cy="254" r="5"/>
  </g>

  <!-- ground rule, anchoring the lowest tread -->
  <path d="M70 648H530" fill="none" stroke="#E9E1D2" stroke-width="1" opacity="0.16"/>
</svg>
