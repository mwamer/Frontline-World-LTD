<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Insight | Frontline World</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <style>

        .single-insight-page {
            padding: 140px 0 80px;
        }


        .single-insight-container {
            max-width: 900px;
            margin: 0 auto;
        }


        .insight-back-link {
            display: inline-block;
            margin-bottom: 40px;
            text-decoration: none;
            font-weight: 600;
        }


        .single-insight-category {
            display: inline-block;
            margin-bottom: 15px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }


        .single-insight-title {
            font-size: clamp(
                2rem,
                5vw,
                4rem
            );

            line-height: 1.15;

            margin-bottom: 20px;
        }


        .single-insight-meta {
            margin-bottom: 40px;
            font-size: 0.95rem;
        }


        .single-insight-featured-image {
            margin-bottom: 40px;
        }


        .single-insight-featured-image img {
            width: 100%;
            display: block;
            object-fit: cover;
        }


        .single-insight-body {
            font-size: 1.1rem;
            line-height: 1.8;
        }


        .single-insight-body h2,
        .single-insight-body h3 {
            margin-top: 40px;
            margin-bottom: 20px;
        }


        .single-insight-body p {
            margin-bottom: 20px;
        }


        .single-insight-body ul,
        .single-insight-body ol {
            margin-bottom: 25px;
            padding-left: 25px;
        }


        .single-insight-body blockquote {
            margin: 30px 0;
            padding: 20px 25px;
            border-left: 4px solid #b08d57;
            font-style: italic;
        }


        .single-insight-gallery {
            display: grid;
            grid-template-columns: repeat(
                2,
                1fr
            );

            gap: 20px;

            margin-top: 40px;
        }


        .single-insight-gallery img {
            width: 100%;
            display: block;
        }


        .insight-loading,
        .insight-message {
            padding: 40px 0;
        }


        @media (
            max-width: 700px
        ) {

            .single-insight-gallery {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="site-header">

        <div class="container">

            <nav class="main-nav">

                <a
                    href="index.html"
                    class="logo"
                >
                    Frontline World
                </a>


                <div class="nav-links">

                    <a href="index.html#about">
                        About
                    </a>

                    <a href="index.html#approach">
                        Approach
                    </a>

                    <a href="index.html#pillars">
                        Services
                    </a>

                    <a href="index.html#projects">
                        Projects
                    </a>

                    <a href="index.html#mission">
                        Mission
                    </a>

                    <a href="index.html#contact">
                        Contact
                    </a>

                </div>

            </nav>

        </div>

    </header>



    <!-- INSIGHT -->

    <main class="single-insight-page">

        <div
            class="container single-insight-container"
        >


            <a
                href="insights.html"
                class="insight-back-link"
            >
                ← Back to News &amp; Insights
            </a>


            <div
                id="single-insight-content"
            >

                <p class="insight-loading">
                    Loading insight...
                </p>

            </div>


        </div>

    </main>



    <!-- FOOTER -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 Frontline World.
                All rights reserved.
            </p>

        </div>

    </footer>



    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js">
    </script>


    <script>

        window.SUPABASE_URL =
            'https://hyeubekegkvnolzbvxnh.supabase.co';


        window.SUPABASE_ANON_KEY =
            'sb_publishable_M4vOrMcF_PQAcnhSatSteg_t25kBpCr';


        window.supabaseClient =
            window.supabase.createClient(
                window.SUPABASE_URL,
                window.SUPABASE_ANON_KEY
            );

    </script>



    <!-- LOAD INSIGHT -->

    <script>

        function escapeHtml(value) {

            return String(
                value || ''
            ).replace(
                /[&<>"']/g,
                function (character) {

                    const characters = {

                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#039;'

                    };


                    return characters[
                        character
                    ];

                }
            );

        }



        function formatDate(dateValue) {

            if (!dateValue) {
                return '';
            }


            return new Date(
                dateValue
            ).toLocaleDateString(
                undefined,
                {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                }
            );

        }



        async function loadInsight() {

            const container =
                document.getElementById(
                    'single-insight-content'
                );


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const slug =
                params.get('slug');


            if (!slug) {

                container.innerHTML =
                    '<p class="insight-message">' +
                    'Insight not found.' +
                    '</p>';

                return;

            }


            try {

                const result =
                    await window.supabaseClient
                        .from(
                            'insights_posts'
                        )
                        .select(
                            '*'
                        )
                        .eq(
                            'slug',
                            slug
                        )
                        .eq(
                            'status',
                            'published'
                        )
                        .single();


                if (result.error) {
                    throw result.error;
                }


                const post =
                    result.data;


                if (!post) {

                    container.innerHTML =
                        '<p class="insight-message">' +
                        'Insight not found.' +
                        '</p>';

                    return;

                }


                document.title =
                    post.title +
                    ' | Frontline World';


                let featuredImage = '';


                if (
                    post.featured_image_url
                ) {

                    featuredImage =
                        '<div class="single-insight-featured-image">' +

                        '<img src="' +

                        escapeHtml(
                            post.featured_image_url
                        ) +

                        '" alt="' +

                        escapeHtml(
                            post.title
                        ) +

                        '">' +

                        '</div>';

                }


                let gallery = '';


                if (
                    Array.isArray(
                        post.image_urls
                    ) &&
                    post.image_urls.length > 1
                ) {

                    const galleryImages =
                        post.image_urls
                            .slice(1)
                            .map(
                                function (url) {

                                    return (

                                        '<img src="' +

                                        escapeHtml(
                                            url
                                        ) +

                                        '" alt="' +

                                        escapeHtml(
                                            post.title
                                        ) +

                                        '">'

                                    );

                                }
                            )
                            .join('');


                    if (galleryImages) {

                        gallery =
                            '<div class="single-insight-gallery">' +

                            galleryImages +

                            '</div>';

                    }

                }


                container.innerHTML =

                    (

                        post.category

                            ?

                            '<div class="single-insight-category">' +

                            escapeHtml(
                                post.category
                            ) +

                            '</div>'

                            :

                            ''

                    )

                    +

                    '<h1 class="single-insight-title">' +

                    escapeHtml(
                        post.title
                    ) +

                    '</h1>'


                    +

                    '<div class="single-insight-meta">' +

                    formatDate(
                        post.publication_date ||
                        post.published_at ||
                        post.created_at
                    )

                    +

                    '</div>'


                    +

                    featuredImage


                    +

                    '<article class="single-insight-body">' +

                    (
                        post.body ||

                        '<p>' +

                        escapeHtml(
                            post.excerpt || ''
                        ) +

                        '</p>'
                    )

                    +

                    '</article>'


                    +

                    gallery;


            } catch (error) {

                console.error(
                    'Error loading insight:',
                    error
                );


                container.innerHTML =
                    '<p class="insight-message">' +

                    'Unable to load this insight.' +

                    '</p>';

            }

        }



        loadInsight();

    </script>


</body>

</html>
