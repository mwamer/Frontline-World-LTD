<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>


<script>

    /* =====================================================
       SUPABASE CONFIGURATION
       ===================================================== */

    const SUPABASE_URL =
        'https://hyeubekegkvnolzbvxnh.supabase.co';


    const SUPABASE_ANON_KEY =
        'sb_publishable_M4vOrMcF_PQAcnhSatSteg_t25kBpCr';


    const client =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );



    /* =====================================================
       HELPERS
       ===================================================== */

    function escapeHtml(value) {

        return String(value || '')
            .replace(
                /[&<>"']/g,
                function (character) {

                    const characters = {

                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#039;'

                    };


                    return characters[
                        character
                    ];

                }
            );

    }



    function formatDate(dateValue) {

        if (!dateValue) {
            return '';
        }


        return new Date(
            dateValue
        ).toLocaleDateString(
            undefined,
            {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            }
        );

    }



    /* =====================================================
       GET URL SLUG
       ===================================================== */

    function getSlug() {

        const parameters =
            new URLSearchParams(
                window.location.search
            );


        return parameters.get(
            'slug'
        );

    }



    /* =====================================================
       RENDER INSIGHT
       ===================================================== */

    function renderInsight(post) {

        const container =
            document.getElementById(
                'single-insight-container'
            );


        const imageUrls =
            Array.isArray(post.image_urls)
                ? post.image_urls
                : [];


        const featuredImage =
            post.featured_image_url ||
            (
                imageUrls.length
                    ? imageUrls[0]
                    : null
            );


        const galleryImages =
            imageUrls.filter(
                function (imageUrl) {

                    return imageUrl !==
                        featuredImage;

                }
            );


        const publicationDate =
            post.publication_date ||
            post.published_at ||
            post.created_at;


        let html = '';


        /* Back link */

        html +=
            '<a ' +

            'href="insights.html" ' +

            'class="single-insight-back">' +

            '&larr; Back to News &amp; Insights' +

            '</a>';



        /* Category */

        if (post.category) {

            html +=
                '<div ' +

                'class="single-insight-category">' +

                escapeHtml(
                    post.category
                ) +

                '</div>';

        }



        /* Title */

        html +=
            '<h1 ' +

            'class="single-insight-title">' +

            escapeHtml(
                post.title
            ) +

            '</h1>';



        /* Meta */

        html +=
            '<div ' +

            'class="single-insight-meta">' +

            formatDate(
                publicationDate
            ) +

            '</div>';



        /* Featured image */

        if (featuredImage) {

            html +=
                '<div ' +

                'class="single-insight-featured-image">' +

                '<img ' +

                'src="' +

                escapeHtml(
                    featuredImage
                ) +

                '" ' +

                'alt="' +

                escapeHtml(
                    post.title
                ) +

                '">' +

                '</div>';

        }



        /* Excerpt */

        if (post.excerpt) {

            html +=
                '<div ' +

                'class="single-insight-excerpt">' +

                escapeHtml(
                    post.excerpt
                ) +

                '</div>';

        }



        /* Body */

        if (post.body) {

            html +=
                '<article ' +

                'class="single-insight-body">' +

                post.body +

                '</article>';

        }



        /* Gallery */

        if (galleryImages.length) {

            html +=
                '<div ' +

                'class="single-insight-gallery">';


            galleryImages.forEach(
                function (imageUrl, index) {

                    html +=
                        '<img ' +

                        'src="' +

                        escapeHtml(
                            imageUrl
                        ) +

                        '" ' +

                        'alt="' +

                        escapeHtml(
                            post.title
                        ) +

                        ' image ' +

                        (index + 2) +

                        '">';

                }
            );


            html +=
                '</div>';

        }


        container.innerHTML = html;

    }



    /* =====================================================
       LOAD INSIGHT
       ===================================================== */

    async function loadInsight() {

        const container =
            document.getElementById(
                'single-insight-container'
            );


        const slug =
            getSlug();


        if (!slug) {

            container.innerHTML =
                '<div class="insight-message">' +

                '<h2>Insight not found</h2>' +

                '<p>' +

                'No insight was selected.' +

                '</p>' +

                '<p>' +

                '<a href="insights.html">' +

                'Return to News &amp; Insights' +

                '</a>' +

                '</p>' +

                '</div>';


            return;

        }


        try {

            const result =
                await client
                    .from(
                        'insights_posts'
                    )
                    .select(
                        'id, title, slug, excerpt, body, category, status, publication_date, featured_image_url, image_urls, created_at, published_at'
                    )
                    .eq(
                        'slug',
                        slug
                    )
                    .eq(
                        'status',
                        'published'
                    )
                    .single();


            if (result.error) {

                throw result.error;

            }


            if (!result.data) {

                throw new Error(
                    'Insight not found.'
                );

            }


            document.title =
                result.data.title +
                ' | Frontline World';


            renderInsight(
                result.data
            );


        } catch (error) {

            console.error(
                'Error loading insight:',
                error
            );


            container.innerHTML =
                '<div class="insight-message">' +

                '<h2>Insight not found</h2>' +

                '<p>' +

                'The requested insight could not be found.' +

                '</p>' +

                '<p>' +

                '<a href="insights.html">' +

                'Return to News &amp; Insights' +

                '</a>' +

                '</p>' +

                '</div>';

        }

    }



    /* =====================================================
       START
       ===================================================== */

    loadInsight();

</script>
