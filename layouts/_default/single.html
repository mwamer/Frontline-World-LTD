{{ define "main" }}
<!-- Page Header -->
<section class="page-header">
    <div class="container">
        <p class="page-kicker">Frontline World</p>
        <h1>{{ .Title }}</h1>
        {{- if .Description }}
        <p class="page-lead">{{ .Description }}</p>
        {{- end }}
    </div>
</section>

{{- if .Params.image }}
<div class="container page-feature">
    {{ partial "image-frame.html" (dict "ratio" "wide" "tone" "sand" "src" .Params.image "alt" .Title) }}
</div>
{{- end }}

<!-- Page Content -->
<section class="about-content">
    <div class="container">
        {{ .Content }}
    </div>
</section>
{{ end }}
