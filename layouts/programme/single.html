{{ define "main" }}
<header class="page-header" aria-labelledby="programme-heading">
    <div class="container">
        <p class="page-kicker"><a href="{{ "training-academy" | relURL }}">Frontline World Training Academy</a></p>
        <h1 id="programme-heading">{{ .Title }}</h1>
        <p class="page-lead">{{ .Description }}</p>
        <div class="programme-facts">
            <p><strong>Audience</strong> {{ .Params.target_audience }}</p>
            <p><strong>Format</strong> {{ delimit .Params.delivery_formats " · " }}</p>
            <p><strong>Next cohort</strong> Dates to be announced</p>
        </div>
        <div class="hero-actions">
            <a class="cta-button" href="{{ "contact" | relURL }}?course={{ .Title | urlquery }}">Apply for This Programme</a>
            <a class="cta-button secondary" href="{{ "training-academy" | relURL }}#programmes">Back to Programmes</a>
        </div>
    </div>
</header>

<article class="programme-body">
    <div class="container programme-body-inner">
        {{ .Content }}
    </div>
</article>
{{ end }}
