{{ define "main" }}
<main class="single-insight-page">
    <div class="container single-insight-container">
        <a href="{{ "news" | relURL }}" class="insight-back-link">&larr; Back to News</a>

        {{- if .Params.news_type }}
        <div class="single-insight-category">{{ .Params.news_type }}</div>
        {{- end }}

        <h1 class="single-insight-title">{{ .Title }}</h1>

        <div class="single-insight-meta">
            {{ .Date.Format "January 2, 2006" }}
        </div>

        {{- if .Params.image }}
        <div class="single-insight-featured-image">
            <img src="{{ .Params.image | relURL }}" alt="{{ .Title }}">
        </div>
        {{- end }}

        <article class="single-insight-body">
            {{ .Content }}
        </article>
    </div>
</main>
{{ end }}
