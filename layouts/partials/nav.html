<header class="site-header">
    <nav class="navbar" aria-label="Primary">
        <div class="container navbar-inner">
            <a href="{{ "" | relURL }}" class="logo">Frontline World</a>
            <button type="button" class="nav-toggle" aria-controls="primary-navigation" aria-expanded="false" onclick="toggleMenu(event)">
                <span class="visually-hidden">Menu</span>
                <span class="nav-toggle-icon" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </button>
            <ul id="primary-navigation" class="nav-links">
                {{- range .Site.Menus.main }}
                <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
                {{- end }}
            </ul>
        </div>
    </nav>
</header>
